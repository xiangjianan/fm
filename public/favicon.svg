<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="halo" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2a1a0e"/><stop offset="1" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff8a2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#262630" stroke-width="3"/>
  <!-- 调频刻度 -->
  <g stroke="#3a3a46" stroke-width="6" stroke-linecap="round">
    <line x1="96" y1="106" x2="96" y2="96"/><line x1="150" y1="110" x2="150" y2="96"/>
    <line x1="204" y1="106" x2="204" y2="96"/><line x1="258" y1="110" x2="258" y2="96"/>
    <line x1="312" y1="106" x2="312" y2="96"/><line x1="366" y1="110" x2="366" y2="96"/>
    <line x1="420" y1="106" x2="420" y2="96"/>
  </g>
  <line x1="366" y1="92" x2="366" y2="118" stroke="#ff8a2a" stroke-width="8" stroke-linecap="round"/>
  <!-- 频率数字 -->
  <text x="256" y="228" font-family="Menlo, monospace" font-size="104" font-weight="300"
        fill="#ffb35c" text-anchor="middle" letter-spacing="2">99.0</text>
  <!-- 发光波形 -->
  <g fill="url(#bar)">
    <rect x="118" y="308" width="14" height="42" rx="7"/>
    <rect x="160" y="284" width="14" height="90" rx="7"/>
    <rect x="202" y="322" width="14" height="28" rx="7"/>
    <rect x="244" y="270" width="14" height="104" rx="7"/>
    <rect x="286" y="300" width="14" height="50" rx="7"/>
    <rect x="328" y="286" width="14" height="78" rx="7"/>
    <rect x="370" y="314" width="14" height="36" rx="7"/>
  </g>
  <text x="256" y="430" font-family="PingFang SC, sans-serif" font-size="42" font-weight="600"
        fill="#ecebe6" text-anchor="middle" letter-spacing="10">收音机</text>
</svg>
